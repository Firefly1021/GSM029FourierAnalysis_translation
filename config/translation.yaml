{
  "schema_version": 1,
  "source_language": "en",
  "target_language": "zh-Hans",
  "terminology": {
    "control_file": "glossary/terminology.tsv",
    "allowed_review_statuses": ["unreviewed", "needs-review", "approved", "rejected"],
    "default_review_status": "unreviewed"
  },
  "proper_names": {
    "control_file": "glossary/proper-names.tsv",
    "preserve_exactly": true,
    "translate_ordinary_eponym_noun_only": true
  },
  "notation": {"control_file": "glossary/notation.tsv"},
  "unresolved": {"control_file": "glossary/unresolved.tsv"},
  "formulas": {
    "stable_ids_required": true,
    "preserve_tokens": true,
    "uncertain_requires_manual_review": true
  },
  "quality": {
    "confidence_minimum": 0.0,
    "confidence_maximum": 1.0,
    "manual_review_statuses": ["not-reviewed", "needs-review", "reviewed", "approved", "rejected"]
  },
  "punctuation": {
    "chinese_prose_ascii_only": true,
    "allowed": [",", ".", ":", ";", "?", "!", "(", ")", "[", "]", "..."],
    "forbidden": ["，", "。", "：", "；", "？", "！", "（", "）", "【", "】", "……"],
    "excluded_contexts": ["math", "latex-command", "label", "reference-key", "citation-key", "path", "url", "bibtex", "code", "raw-template", "source-input"]
  },
  "cross_references": {
    "semantic_labels_required": true,
    "hard_coded_local_numbers_forbidden": true,
    "formula_reference_command": "eqref",
    "other_reference_command": "ref",
    "unresolved_targets_to_qa": true
  }
}
