{
  "schema_version": 2,
  "source_language": "en",
  "target_language": "zh-Hans",
  "terminology": {
    "global_control_file": "glossary/terminology.tsv",
    "history_file": "glossary/terminology-history.tsv",
    "book_candidates": "books/<book-id>/glossary/candidates.tsv",
    "book_unresolved": "books/<book-id>/glossary/unresolved.tsv",
    "allowed_statuses": ["approved", "proposed", "ambiguous", "rejected", "needs-review"]
  },
  "proper_names": {
    "book_control_file": "books/<book-id>/glossary/proper-names.tsv",
    "preserve_exactly": true,
    "translate_ordinary_eponym_noun_only": true
  },
  "notation": {"book_control_file": "books/<book-id>/glossary/notation.tsv"},
  "formulas": {
    "stable_ids_required": true,
    "preserve_tokens": true,
    "uncertain_requires_manual_review": true
  },
  "punctuation": {
    "chinese_prose_ascii_only": true,
    "allowed": [",", ".", ":", ";", "?", "!", "(", ")", "[", "]", "..."],
    "forbidden": ["，", "。", "：", "；", "？", "！", "（", "）", "【", "】", "……"],
    "excluded_contexts": ["math", "latex-command", "label", "reference-key", "citation-key", "path", "url", "bibtex", "code", "raw-template", "source-input"]
  },
  "cross_references": {
    "semantic_labels_required": true,
    "hard_coded_local_numbers_forbidden": true,
    "formula_reference_command": "eqref",
    "other_reference_command": "ref",
    "unresolved_targets_to_qa": true
  }
}
