{
  "schema_version": 2,
  "system": "multi-book-mathematical-translation",
  "default_branch": "main",
  "book_branch_prefix": "book/",
  "worktree_directory_suffix": "-worktrees",
  "template": {
    "version": "2.0.0-user-style-20260822",
    "style": "template/style/Mystyle.sty",
    "reference": "template/reference/main.tex",
    "assets": ["template/assets/ref.bib"],
    "adapter": "template/adapter/translation-adapter.sty",
    "macros": "template/adapter/translation-macros.tex",
    "document_class": "ctexart",
    "engine": "xelatex",
    "bibliography_tool": "biber"
  },
  "shared_read_only_on_book_branches": [
    "AGENTS.md", "src", "scripts", "schemas", "tests", "template", "style",
    "config", "glossary/terminology.tsv"
  ],
  "automation": {
    "sample_processor": [],
    "translation_processor": [],
    "finish_processor": []
  },
  "remote_writes_enabled": false
}
