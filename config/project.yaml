{
  "schema_version": 1,
  "phase": "phase-2-full-book-translation",
  "paths": {
    "template_style": "input/template/style",
    "template_reference": "input/template/reference",
    "template_assets": "input/template/assets",
    "source_pdf": "input/source",
    "structured_source": "structured/source",
    "structured_reviewed": "structured/reviewed",
    "translation_draft": "translation/draft",
    "translation_reviewed": "translation/reviewed",
    "translation_final": "translation/final",
    "tex": "tex",
    "qa": "qa"
  },
  "read_only_roots": ["input/template", "input/source"],
  "template": {
    "reference": "input/template/reference/main.tex",
    "style": "input/template/style/Mystyle.sty",
    "assets": ["input/template/assets/ref.bib"],
    "document_class": "ctexart",
    "engine": "xelatex",
    "bibliography_tool": "biber",
    "index_tool": null
  },
  "supported_block_types": [
    "chapter", "section", "subsection", "definition", "theorem", "lemma",
    "proposition", "corollary", "proof", "example", "remark", "exercise",
    "equation", "figure", "table", "footnote", "ordinary-paragraph", "unknown"
  ]
}
