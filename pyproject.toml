[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbook-translation"
version = "1.0.0"
description = "Local-first multi-book mathematical translation workflow with Git worktree isolation."
requires-python = ">=3.10"
dependencies = ["pypdf>=5", "pdfplumber>=0.11", "Pillow>=10"]

[project.scripts]
mathbook = "mathbook.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
