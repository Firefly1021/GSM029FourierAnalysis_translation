[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mathbook-translation-scaffold"
version = "0.0.0"
description = "Empty scaffold for a future mathematical book translation project."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mathbook = "mathbook.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

